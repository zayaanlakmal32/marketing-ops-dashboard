<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Accelerate Marketing Ops</title>
<script>try{if(localStorage.getItem("mo2-theme")==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: ops console. Sticky glass header with sliding tab pill; each view = title row, uniform stat tiles, then equal-gutter panels.
   Palette: blended deep navy with layered white tints (dark, default) / cool paper whites with navy ink (light). */
:root{
  --bg:#070D1C; --bg-2:#0E1A36; --surface:#101B34; --surface-2:#15223F; --raise:rgba(255,255,255,.035);
  --ink:#EAF0FB; --ink-2:#C9D3E6; --muted:#8C99B5; --line:rgba(201,214,240,.10); --line-strong:rgba(201,214,240,.20);
  --blue:#7C9CFF; --blue-2:#A9C0FF; --blue-ink:#071026; --blue-soft:rgba(124,156,255,.14);
  --good:#4FD18B; --good-soft:rgba(79,209,139,.13); --warn:#F2B654; --warn-soft:rgba(242,182,84,.14); --bad:#FF7A8A; --bad-soft:rgba(255,122,138,.14);
  --none:#34425F; --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 12px 32px -18px rgba(0,0,0,.7);
  --glow:radial-gradient(1200px 520px at 12% -10%, rgba(83,120,255,.20), transparent 60%), radial-gradient(900px 480px at 100% 0%, rgba(160,190,255,.09), transparent 55%);
  --header:rgba(7,13,28,.72);
  --sans:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:14px; --r-sm:10px; --pad:20px; --gap:16px;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#EEF2F9; --bg-2:#F7F9FD; --surface:#FFFFFF; --surface-2:#F5F7FC; --raise:rgba(16,32,80,.025);
  --ink:#0C1830; --ink-2:#2A3956; --muted:#5D6B86; --line:rgba(16,32,80,.09); --line-strong:rgba(16,32,80,.17);
  --blue:#2F55E4; --blue-2:#1C3FBF; --blue-ink:#FFFFFF; --blue-soft:rgba(47,85,228,.09);
  --good:#178248; --good-soft:rgba(23,130,72,.10); --warn:#A8620A; --warn-soft:rgba(168,98,10,.11); --bad:#C52A3E; --bad-soft:rgba(197,42,62,.09);
  --none:#C7D0E2; --shadow:0 1px 2px rgba(16,32,80,.05), 0 10px 28px -20px rgba(16,32,80,.35);
  --glow:radial-gradient(1100px 500px at 10% -10%, rgba(47,85,228,.10), transparent 60%), radial-gradient(800px 420px at 100% 0%, rgba(120,150,230,.10), transparent 55%);
  --header:rgba(238,242,249,.78);
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--glow),linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);background-color:var(--bg);background-attachment:fixed;min-height:100%;transition:background-color .35s var(--ease)}
body{margin:0;background:transparent;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100vh;transition:background-color .35s var(--ease),color .35s var(--ease)}
a{color:var(--blue);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--blue-2)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:24px;padding-block:0 72px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--header);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap}
.brand{font-weight:600;letter-spacing:-.015em;font-size:15px;display:flex;align-items:center;gap:8px}
.brand .mark{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--blue),var(--blue-2));box-shadow:0 4px 14px -4px var(--blue)}
.brand em{font-style:normal;color:var(--muted);font-weight:500}
.draft{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:999px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
nav.tabs{position:relative;display:flex;gap:2px;padding:4px;border-radius:12px;background:var(--raise);border:1px solid var(--line)}
nav.tabs .pill{position:absolute;top:4px;left:0;height:calc(100% - 8px);border-radius:9px;background:var(--surface-2);box-shadow:0 0 0 1px var(--line-strong),0 6px 18px -10px rgba(0,0,0,.6);transition:transform .38s var(--ease),width .38s var(--ease);z-index:0;pointer-events:none}
nav.tabs button{white-space:nowrap;position:relative;z-index:1;color:var(--muted);background:none;border:0;font:inherit;font-weight:500;font-size:13px;padding:7px 14px;border-radius:9px;cursor:pointer;transition:color .2s}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--bad);color:var(--blue-ink);font-family:var(--mono);font-size:10.5px;line-height:17px;text-align:center}
.theme-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--ink-2);font:inherit;font-size:12.5px;font-weight:500;cursor:pointer}
.theme-btn svg{width:15px;height:15px}
.theme-btn:hover{color:var(--ink);border-color:var(--line-strong)}

/* page heading + stat tiles */
.hero{padding-block:30px 18px;display:flex;flex-direction:column;gap:18px}
.hero-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
h1{font-size:clamp(26px,3.2vw,34px);line-height:1.1;letter-spacing:-.03em;font-weight:600;margin:8px 0 0;text-wrap:balance}
h1 em,h2 em{font-style:normal;background:linear-gradient(90deg,var(--blue),var(--blue-2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;text-wrap:balance}
h2 .sub{font-family:var(--mono);font-size:11.5px;font-weight:400;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--gap)}
@media (max-width:900px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:last-child:nth-child(odd){grid-column:1 / -1}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.stat b{display:block;font-size:30px;font-weight:600;line-height:1;color:var(--ink);letter-spacing:-.03em}
.stat span{font-size:12px;color:var(--muted);font-weight:500}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)}
.stat.bad{background:linear-gradient(180deg,var(--bad-soft),transparent 70%),var(--surface)}
.stat.warn{background:linear-gradient(180deg,var(--warn-soft),transparent 70%),var(--surface)}

/* panels + grid */
.grid{display:grid;gap:var(--gap)}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
@media (max-width:900px){.g-2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:var(--gap)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);min-width:0;box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;min-height:32px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.panel-h + .row,.row:first-child{border-top:0;padding-top:4px}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .t a{color:var(--ink);text-decoration-color:var(--line-strong)}
.row .t a:hover{color:var(--blue)}
.row .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.sev{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--none)}
.sev.bad{background:var(--bad);box-shadow:0 0 0 4px var(--bad-soft)} .sev.warn{background:var(--warn);box-shadow:0 0 0 4px var(--warn-soft)} .sev.good{background:var(--good);box-shadow:0 0 0 4px var(--good-soft)} .sev.blue{background:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue);white-space:nowrap;text-decoration:none}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.good{background:var(--good-soft);color:var(--good)} .pill.muted{background:transparent;color:var(--muted);border:1px solid var(--line-strong)}
.pills{display:flex;gap:5px;flex-wrap:wrap}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.empty b{color:var(--ink-2);font-weight:600}
.note{font-size:12.5px;color:var(--muted)}
.banner{border-radius:var(--r-sm);padding:11px 14px;font-weight:500;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:var(--gap);border:1px solid transparent}
.banner.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-soft)}
.banner.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-soft)}
.banner.info{background:var(--blue-soft);color:var(--ink-2);border-color:var(--blue-soft)}

/* controls */
button,.btn{font:inherit;font-weight:500;font-size:13px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);padding:8px 14px;cursor:pointer;transition:border-color .2s,color .2s,background .2s,transform .15s}
button:hover{border-color:var(--blue);color:var(--blue)}
button:active{transform:translateY(1px)}
button.primary{background:linear-gradient(180deg,var(--blue),var(--blue-2));border-color:transparent;color:var(--blue-ink);box-shadow:0 8px 20px -10px var(--blue)}
button.primary:hover{filter:brightness(1.07);color:var(--blue-ink)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 10px}
button.ghost:hover{color:var(--blue);background:var(--blue-soft)}
button.danger{color:var(--bad)}
button.danger:hover{background:var(--bad-soft);color:var(--bad)}
button.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--blue-ink)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg-2);border:1px solid var(--line-strong);border-radius:9px;padding:8px 10px;min-width:0;max-width:100%;height:38px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-items:end}
.form label.f.wide{grid-column:span 2}
@media (max-width:520px){.form label.f.wide{grid-column:auto}}
.form button{height:38px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:var(--gap)}
.fresh{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

/* tables */
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{transition:background .2s}
tbody tr:hover{background:var(--raise)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
table.up-tbl{table-layout:fixed;min-width:960px}
table.up-tbl col.c1{width:17%} table.up-tbl col.c2{width:10%} table.up-tbl col.c3{width:22%} table.up-tbl col.c4{width:25%} table.up-tbl col.c5{width:26%}

/* funnel map */
table.map{table-layout:fixed;min-width:860px}
table.map col.cname{width:20%} table.map col.cstage{width:14%} table.map col.copen{width:10%}
.map td{padding:5px;vertical-align:middle}
.map td.name{font-weight:600;padding-right:14px}
.mapcell{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--raise);height:62px;font-weight:500;color:var(--ink)}
.mapcell:hover{border-color:var(--line-strong);color:var(--ink);transform:translateY(-1px)}
.mapcell .s{font-size:12px;font-weight:600}
.mapcell .c{font-family:var(--mono);font-size:11px;color:var(--muted)}
.mapcell.done{background:var(--good-soft);border-color:transparent}.mapcell.done .s{color:var(--good)}
.mapcell.active{background:var(--blue-soft);border-color:transparent}.mapcell.active .s{color:var(--blue)}
.mapcell.stuck{background:var(--bad-soft);border-color:transparent}.mapcell.stuck .s{color:var(--bad)}
.mapcell.empty .s{color:var(--muted)}
.mapcell.sel{box-shadow:0 0 0 2px var(--blue)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:500}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--gap);align-items:stretch}
.adcard{border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);background:var(--surface);display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow);transition:transform .25s var(--ease),border-color .25s}
.adcard:hover{transform:translateY(-2px);border-color:var(--line-strong)}
.adcard .kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.adcard .kpis div b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em}
.adcard .kpis div span{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.up{color:var(--bad);font-weight:600} .down{color:var(--good);font-weight:600}
details.edit{margin-top:8px}
details.edit summary{cursor:pointer;font-size:12.5px;font-weight:500;color:var(--blue);list-style:none;display:inline-flex}
details.edit summary::-webkit-details-marker{display:none}
details.edit .form{margin-top:10px;padding:12px;border:1px dashed var(--line-strong);border-radius:var(--r-sm);grid-template-columns:repeat(2,minmax(0,1fr))}
details.edit .form label.f.wide{grid-column:1 / -1}
details[open] .form{animation:pop .28s var(--ease) both}
.brief{font-size:13px;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto;background:var(--raise);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;margin-top:8px}
.links{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;font-weight:500;margin-top:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface-2);color:var(--ink);border:1px solid var(--line-strong);padding:10px 18px;border-radius:999px;font-weight:500;font-size:13px;z-index:60;box-shadow:0 18px 40px -18px rgba(0,0,0,.7);animation:toast .35s var(--ease) both}

/* motion */
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes toast{from{opacity:0;transform:translate(-50%,14px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
.view.enter{animation:viewIn .42s var(--ease) both}
.view.enter .stat,.view.enter .panel,.view.enter .adcard,.view.enter .row,.view.enter tbody tr{animation:pop .5s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms + 60ms)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:600px){.wrap,.top-in{padding-inline:16px} .top-right{margin-left:0;width:100%} nav.tabs{flex:1;overflow-x:auto} .stat b{font-size:24px}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><span class="mark" aria-hidden="true"></span>Accelerate <em>Marketing Ops</em> <span class="draft">Draft v1</span></div>
  <div class="top-right">
    <nav class="tabs" id="tabs" aria-label="Sections">
      <span class="pill" id="tab-pill" aria-hidden="true"></span>
      <button data-tab="today" type="button">Today</button>
      <button data-tab="funnels" type="button">Funnels</button>
      <button data-tab="upsell" type="button">Upsell</button>
      <button data-tab="ads" type="button">Ads</button>
      <button data-tab="briefs" type="button">Briefs</button>
    </nav>
    <button type="button" class="theme-btn" id="theme-btn" aria-label="Switch theme"></button>
  </div>
</div></header>
<main class="wrap" id="app">
  <div class="hero"><div><div class="eyebrow">Loading</div><h1>Pulling live <em>funnel</em> data from Notion</h1><p class="note">Reading PM Engine v2, the Project Tracker and the Strategy Board.</p></div></div>
</main>
<div id="toast-root"></div>

<script>
(function(){
/* ---------- constants ---------- */
const NOTION = "Notion";
const TOOL = "notion-query-data-sources";
const DS = {
  tracker: "collection://b6b396fe-f0cf-4d7e-9845-e18c630c0ae7",
  projects: "collection://2b1b6494-fc14-82b9-8659-872f524ab1fd",
  tasks: "collection://9acb6494-fc14-8290-af49-87a1c6c613ed",
  board: "collection://309b6494-fc14-8073-ae13-000b7a00ba6e"
};
const STAGES = ["Ads","Landing page","Lead magnet","CRM + automations","Nurture"];
const ADDONS = ["Meta Ads setup & Management","CRM Setup","Manychat Setup","Website Optimization","Website Build (From scratch)","Editing"];
const ISSUE_TO_ADDON = {
  "6.1":"Website Optimization","6.5":"CRM Setup","6.6":"Meta Ads setup & Management","6.7":"Manychat Setup","6.2":"Meta Ads setup & Management","6.4":"Meta Ads setup & Management"
};
const CUR = {USD:"$",AUD:"A$",LKR:"Rs ",GBP:"£",NZD:"NZ$",CAD:"C$"};
const STUCK_STATUSES = ["Need Feedback","Need Revision"];

/* ---------- state ---------- */
const S = {
  clients:[], projects:[], tasks:[], board:[],
  err:{core:null,tasks:null}, loading:true, loadedAt:null,
  ads:[], upsell:{}, adsOn:false, upsellOn:false, saving:false
};
const UI = {tab:"today", selCell:null, briefQ:"", adClient:"all"};
try{const t=localStorage.getItem("mo2-tab"); if(t) UI.tab=t;}catch(e){}
if(/^#(today|funnels|upsell|ads|briefs)$/.test(location.hash)) UI.tab=location.hash.slice(1);

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const id32=s=>{const m=String(s||"").replace(/-/g,"").match(/[0-9a-f]{32}/i);return m?m[0].toLowerCase():null};
const arr=v=>{if(Array.isArray(v))return v;if(v==null||v==="")return[];try{const x=JSON.parse(v);return Array.isArray(x)?x:[]}catch(e){return[]}};
const nlink=id=>"https://www.notion.so/"+id;
function iso(d){const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)}
const TODAY=iso(new Date());
function addDays(s,n){const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return iso(d)}
function diff(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5)}
function fmtDate(s){if(!s)return"";return new Date(s.slice(0,10)+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"})}
function money(v,c){if(v==null||isNaN(v))return"–";const sym=CUR[c]||"$";return sym+(v>=100?Math.round(v).toLocaleString():(+v).toFixed(2))}
function firstKey(name){const w=String(name||"").toLowerCase().replace(/[^a-z\s]/g," ").split(/\s+/).filter(x=>x&&x.length>2&&x!=="the");return w[0]||null}
function toast(msg){const r=$("#toast-root");r.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toast._t);toast._t=setTimeout(()=>{r.innerHTML=""},2200)}

/* ---------- data from /api (Notion token stays on the server) ---------- */
let KEY=""; try{KEY=localStorage.getItem("mo2-key")||""}catch(e){}
async function api(path,opts){
  opts=opts||{};
  const res=await fetch(path,{method:opts.method||"GET",headers:Object.assign({"Content-Type":"application/json"},KEY?{"x-access-key":KEY}:{}),body:opts.body?JSON.stringify(opts.body):undefined});
  let j={};try{j=await res.json()}catch(e){}
  if(!res.ok){const err=new Error(j.message||("Request failed ("+res.status+")"));err.code=j.error||res.status;throw err}
  return j;
}
function errText(e){
  if(e&&e.code==="locked")return{msg:"locked",retry:false};
  return{msg:(e&&e.message)||"Couldn't load data from Notion.",retry:true};
}
async function loadAll(fresh){
  S.loading=true;S.err.core=null;S.err.tasks=null;render();
  try{
    const d=await api("/api/data"+(fresh?"?fresh="+Date.now():""));
    S.clients=d.clients||[];S.projects=d.projects||[];S.tasks=d.tasks||[];S.board=d.board||[];
    S.adsOn=Array.isArray(d.ads);S.upsellOn=!!d.upsell;
    const names={};S.clients.forEach(c=>{names[c.id]=c.name});
    S.ads=(d.ads||[]).map(a=>Object.assign({},a,{clientName:names[a.clientId]||"Unknown client"}));
    S.upsell=d.upsell||{};
    S.loadedAt=Date.parse(d.loadedAt)||Date.now();
  }catch(e){S.err.core=errText(e)}
  S.loading=false;if(UI.animOnLoad){UI.anim=true;UI.animOnLoad=false}render();
}

/* ---------- derived ---------- */
const clientById=id=>S.clients.find(c=>c.id===id);
const isOpen=t=>t.status!=="Done";
const isOverdue=t=>isOpen(t)&&t.due&&t.due.slice(0,10)<TODAY;
const isStuck=t=>isOpen(t)&&(STUCK_STATUSES.includes(t.status)||isOverdue(t));
function projectsFor(cid){return S.projects.filter(p=>p.clientIds.includes(cid))}
function tasksFor(cid){const pids=new Set(projectsFor(cid).map(p=>p.id));return S.tasks.filter(t=>t.projectIds.some(x=>pids.has(x)))}
function clientOfTask(t){const p=S.projects.find(p=>t.projectIds.includes(p.id));return p?clientById(p.clientIds[0]):null}
function funnelClients(){return S.clients.filter(c=>projectsFor(c.id).length)}
function stageState(cid,st){
  const ts=tasksFor(cid).filter(t=>t.stage===st);
  const open=ts.filter(isOpen),done=ts.length-open.length;
  let state="empty";
  if(open.some(isStuck))state="stuck";else if(open.length)state="active";else if(done)state="done";
  return{state,open:open.length,done,tasks:ts};
}
const STATE_LABEL={done:"Done",active:"In progress",stuck:"Stuck",empty:"Not started"};
function boardFor(c){
  const k=firstKey(c.name);if(!k)return[];
  return S.board.filter(b=>String(b.client||"").toLowerCase().includes(k)||String(b.title||"").toLowerCase().includes(k));
}
function upsellInfo(c){
  const day=c.start?diff(c.start.slice(0,10),TODAY)+1:null;
  const missing=ADDONS.filter(a=>!c.addons.includes(a));
  const signals=[];
  if(day!=null&&day>=60&&day<=90)signals.push({kind:"warn",text:"Day "+day+" of 90: renewal window"});
  else if(day!=null&&day>90)signals.push({kind:"warn",text:"Past day 90 (day "+day+")"});
  const code=c.issue?String(c.issue).slice(0,3):null;
  if(code&&ISSUE_TO_ADDON[code]&&missing.includes(ISSUE_TO_ADDON[code]))signals.push({kind:"bad",text:"Blocker "+code+" → offer "+ISSUE_TO_ADDON[code]});
  if(c.pstage==="Funnel Creation & Ad Setup"&&missing.includes("Meta Ads setup & Management"))signals.push({kind:"blue",text:"In funnel & ad setup, no ads add-on yet"});
  const cp=S.upsell[c.id]||null;
  let due=false;
  if(cp&&cp.nextDate&&cp.status!=="won"&&cp.status!=="declined"){const d=diff(TODAY,cp.nextDate);due=d<=7;}
  return{day,missing,signals,cp,due};
}
function adStats(cid){
  const logs=S.ads.filter(a=>a.clientId===cid);
  const range=(a,b)=>logs.filter(l=>l.date>=a&&l.date<=b);
  const sum=(xs,k)=>xs.reduce((s,l)=>s+(+l[k]||0),0);
  const w=range(addDays(TODAY,-7),addDays(TODAY,-1)),p=range(addDays(TODAY,-14),addDays(TODAY,-8));
  const s7=sum(w,"spend"),r7=sum(w,"results"),sp=sum(p,"spend"),rp=sum(p,"results");
  const latest=logs.slice().sort((a,b)=>a.date<b.date?1:-1)[0];
  return{count:logs.length,s7,r7,cpr7:r7>0?s7/r7:null,cprP:rp>0?sp/rp:null,cur:latest?latest.currency:"USD",label:latest?latest.resultLabel:"Leads",last:latest?latest.date:null};
}

/* ---------- render ---------- */
function setTab(t){if(t!==UI.tab)UI.anim=true;UI.tab=t;try{localStorage.setItem("mo2-tab",t)}catch(e){}render();window.scrollTo(0,0)}
function renderTabs(){
  const overdue=S.tasks.filter(isStuck).length;
  document.querySelectorAll("#tabs button").forEach(b=>{
    const t=b.dataset.tab;b.setAttribute("aria-current",t===UI.tab?"page":"false");
    const label={today:"Today",funnels:"Funnels",upsell:"Upsell",ads:"Ads",briefs:"Briefs"}[t];
    b.innerHTML=esc(label)+(t==="today"&&overdue?'<span class="count">'+overdue+'</span>':"");
  });
}
function errBanner(e,where){
  if(!e)return"";
  if(e.msg==="locked")return '<form class="banner info form" id="keyform"><label class="f wide" for="key-in">Dashboard password<input id="key-in" type="password" autocomplete="current-password" required></label><button type="submit" class="primary">Unlock</button></form>';
  return '<div class="banner bad" role="alert"><span>'+esc(e.msg)+'</span>'+(e.retry?'<button type="button" data-act="reload">Try again</button>':"")+'</div>';
}
function freshLine(){
  if(S.loading)return'<span class="fresh">Refreshing…</span>';
  return S.loadedAt?'<span class="fresh">Notion data as of '+new Date(S.loadedAt).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})+'</span>':"";
}
function taskRow(t,showClient){
  const c=showClient?clientOfTask(t):null;
  const sev=isOverdue(t)?"bad":STUCK_STATUSES.includes(t.status)?"warn":t.status==="Done"?"good":"blue";
  const bits=[];
  if(c)bits.push('<b>'+esc(c.name)+'</b>');
  bits.push(esc(t.status));
  if(t.due)bits.push((isOverdue(t)?'<span class="up">Due '+fmtDate(t.due)+' · '+diff(t.due.slice(0,10),TODAY)+'d late</span>':'Due '+fmtDate(t.due)));
  return '<div class="row"><span class="sev '+sev+'"></span><div class="main"><div class="t"><a href="'+nlink(t.id)+'" target="_blank" rel="noopener">'+esc(t.name||"Untitled task")+'</a></div><div class="m">'+bits.join(" · ")+'</div></div>'+(t.stage?'<span class="pill muted">'+esc(t.stage)+'</span>':'<span class="pill warn">No stage</span>')+'</div>';
}

    (upDue.length?upDue.map(({c,u})=>'<div class="row"><span class="sev warn"></span><div class="main"><div class="t">'+esc(c.name)+'</div><div class="m">'+esc(u.cp.offer||"Offer not set")+' · '+fmtDate(u.cp.nextDate)+'</div></div></div>').join(""):'<div class="empty">No checkpoints set for this week. '+upSignals+' clients show an upsell signal on the Upsell tab.</div>')+'</section>';

}

function viewBriefs(){
  const q=UI.briefQ.trim().toLowerCase();
  const list=S.clients.filter(c=>!q||String(c.name).toLowerCase().includes(q));
  let h='<div class="hero"><div class="hero-row"><div><div class="eyebrow">Strategy Board + Project Tracker</div><h1>Client <em>briefs</em> and decks</h1></div>'+
    '<label class="f" for="brief-q" style="min-width:220px">Find a client<input id="brief-q" type="search" value="'+esc(UI.briefQ)+'" placeholder="Type a name"></label></div></div>';
  h+=errBanner(S.err.core);
  if(!list.length){h+='<section class="panel"><div class="empty">'+(S.loading?"Loading…":"No client matches that name.")+'</div></section>';return h}
  h+='<div class="cards">'+list.map(c=>{
    const items=boardFor(c);
    const goal=items.map(b=>b.goal).find(Boolean),brief=items.map(b=>b.brief).find(Boolean);
    const links=[];
    if(c.deck)links.push('<a href="'+esc(c.deck)+'" target="_blank" rel="noopener">Strategy deck</a>');
    items.forEach(b=>{if(b.deck&&b.deck!==c.deck)links.push('<a href="'+esc(b.deck)+'" target="_blank" rel="noopener">'+esc(b.type||"Deck")+'</a>');if(b.final)links.push('<a href="'+esc(b.final)+'" target="_blank" rel="noopener">'+esc((b.type||"Final")+" final")+'</a>')});
    return '<div class="adcard"><div class="card-h"><b>'+esc(c.name)+'</b><span class="pill muted">'+esc(c.stage||"No stage")+'</span></div>'+
      '<div class="note">'+esc([c.pstage,c.po&&("PO "+c.po),c.strat&&("Strat "+c.strat)].filter(Boolean).join(" · "))+'</div>'+
      (goal?'<div><span class="note">Goal</span><div><b>'+esc(goal)+'</b></div></div>':'')+
      (items.length?'<div class="pills">'+items.slice(0,6).map(b=>'<a class="pill '+(b.status==="Approved"?"good":b.status==="Backlog"?"muted":"")+'" href="'+nlink(b.id)+'" target="_blank" rel="noopener">'+esc(b.type||b.title)+': '+esc(b.status||"")+'</a>').join("")+'</div>':'<div class="note">No Strategy Board items found for this name.</div>')+
      (brief?'<details class="edit"><summary>Read the brief</summary><div class="brief">'+esc(brief)+'</div></details>':'')+
      (links.length?'<div class="links">'+[...new Set(links)].join("")+'</div>':'')+'</div>';
  }).join("")+'</div>';
  h+='<p class="note" style="margin-top:12px">Strategy Board items are matched to clients by name, so a misspelt client name on the board can hide an item.</p>';
  return h;
}

/* ---------- motion, tab pill, theme ---------- */
function movePill(){const b=document.querySelector('#tabs button[aria-current="page"]'),p=$("#tab-pill");if(!b||!p)return;p.style.width=b.offsetWidth+"px";p.style.transform="translateX("+b.offsetLeft+"px)"}
function stagger(root){let n=0;root.querySelectorAll(".stat,.panel,.adcard,.row,tbody tr").forEach(el=>{el.style.setProperty("--i",Math.min(n++,14))})}
function countUp(root){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  root.querySelectorAll(".stat b").forEach(el=>{const end=+el.textContent;if(!(end>0))return;const t0=performance.now(),d=700;
    const step=t=>{const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=Math.round(end*e);if(k<1)requestAnimationFrame(step)};el.textContent="0";requestAnimationFrame(step)});
}
const ICON_SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICON_MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function paintThemeBtn(){const light=document.documentElement.getAttribute("data-theme")==="light";const b=$("#theme-btn");if(b)b.innerHTML=(light?ICON_MOON+"Dark":ICON_SUN+"Light")}
function toggleTheme(){const r=document.documentElement;const light=r.getAttribute("data-theme")!=="light";if(light)r.setAttribute("data-theme","light");else r.removeAttribute("data-theme");try{localStorage.setItem("mo2-theme",light?"light":"dark")}catch(e){}paintThemeBtn()}

function render(){
  renderTabs();
  const app=$("#app");
  const views={today:viewToday,funnels:viewFunnels,upsell:viewUpsell,ads:viewAds,briefs:viewBriefs};
  const active=document.activeElement&&document.activeElement.id;
  const openDetails=[...document.querySelectorAll("details.edit[open] form")].map(f=>f.dataset.upsell);
  const kept={};app.querySelectorAll("#adform input[id],#adform select[id]").forEach(el=>{kept[el.id]=el.value});
  const anim=UI.anim;UI.anim=false;
  app.innerHTML='<div class="view'+(anim?' enter':'')+'">'+(views[UI.tab]||viewToday)()+'</div>';
  if(anim){stagger(app);countUp(app)}
  requestAnimationFrame(movePill);
  Object.keys(kept).forEach(id=>{const el=document.getElementById(id);if(el)el.value=kept[id]});
  openDetails.forEach(id=>{const f=document.querySelector('form[data-upsell="'+id+'"]');if(f)f.closest("details").open=true});
  if(active){const el=document.getElementById(active);if(el&&el.id==="brief-q"){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const tb=e.target.closest("#tabs button");if(tb){setTab(tb.dataset.tab);return}
  const go=e.target.closest("[data-tab-go]");if(go){setTab(go.dataset.tabGo);return}
  if(e.target.closest('[data-act="reload"]')){UI.animOnLoad=true;loadAll(true);return}
  if(e.target.closest("#theme-btn")){toggleTheme();return}
  const cell=e.target.closest("[data-cell]");if(cell){UI.selCell=UI.selCell===cell.dataset.cell?null:cell.dataset.cell;render();return}
  const clr=e.target.closest("[data-clear]");
  if(clr&&S.upsellOn){
    if(!clr.classList.contains("armed")){clr.classList.add("armed");clr.textContent="Confirm remove";setTimeout(()=>{if(clr.isConnected){clr.classList.remove("armed");clr.textContent="Remove checkpoint"}},3000);return}
    clr.disabled=true;
    try{await api("/api/upsell?clientId="+encodeURIComponent(clr.dataset.clear),{method:"DELETE"});toast("Checkpoint removed");loadAll(true)}catch(x){toast("Couldn't remove: "+x.message);clr.disabled=false}
    return;
  }
  const del=e.target.closest("[data-del]");
  if(del&&S.adsOn){
    if(!del.classList.contains("armed")){del.classList.add("armed");del.textContent="Confirm";setTimeout(()=>{if(del.isConnected){del.classList.remove("armed");del.textContent="Delete"}},3000);return}
    try{await api("/api/ads?id="+encodeURIComponent(del.dataset.del),{method:"DELETE"});toast("Entry deleted");loadAll(true)}catch(x){toast("Couldn't delete: "+x.message)}
  }
});
document.addEventListener("input",e=>{if(e.target.id==="brief-q"){UI.briefQ=e.target.value;render()}});
document.addEventListener("submit",async e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==="keyform"){KEY=f.querySelector("#key-in").value.trim();try{localStorage.setItem("mo2-key",KEY)}catch(x){}loadAll(true);return}
  const btn=f.querySelector('button[type="submit"]');
  if(f.id==="adform"){
    if(!S.adsOn){toast("Ad logging is switched off");return}
    const d=Object.fromEntries(new FormData(f));const c=clientById(d.clientId);
    if(!c){toast("Choose a client");return}
    btn.disabled=true;
    try{
      await api("/api/ads",{method:"POST",body:{clientId:c.id,clientName:c.name,date:d.date,currency:d.currency,spend:+d.spend,results:+d.results,resultLabel:d.resultLabel,note:String(d.note||"").slice(0,300)}});
      toast("Entry added for "+c.name);
      f.querySelector("#ad-spend").value="";f.querySelector("#ad-res").value="";f.querySelector("#ad-note").value="";
      loadAll(true);
    }catch(x){toast("Couldn't save: "+x.message)}
    btn.disabled=false;return;
  }
  if(f.dataset.upsell){
    if(!S.upsellOn){toast("Checkpoints are switched off");return}
    const d=Object.fromEntries(new FormData(f));const c=clientById(f.dataset.upsell);
    btn.disabled=true;
    try{
      await api("/api/upsell",{method:"POST",body:{clientId:f.dataset.upsell,clientName:c?c.name:"",nextDate:d.nextDate,offer:d.offer||"",status:d.status||"planned",note:String(d.note||"").slice(0,400)}});
      toast("Checkpoint saved");f.closest("details").open=false;loadAll(true);
    }catch(x){toast("Couldn't save: "+x.message)}
    btn.disabled=false;
  }
});

/* ---------- boot ---------- */
UI.animOnLoad=true;
paintThemeBtn();
render();
loadAll(false);
window.addEventListener("resize",movePill);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(movePill);
})();
</script>
