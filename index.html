:root[data-theme="light"]{
  --bg:#EEF2F9; --bg-2:#F7F9FD; --surface:#FFFFFF; --surface-2:#F5F7FC; --raise:rgba(16,32,80,.025);
  --ink:#0C1830; --ink-2:#2A3956; --muted:#5D6B86; --line:rgba(16,32,80,.09); --line-strong:rgba(16,32,80,.17);
  --blue:#2F55E4; --blue-2:#1C3FBF; --blue-ink:#FFFFFF; --blue-soft:rgba(47,85,228,.09);
  --good:#178248; --good-soft:rgba(23,130,72,.10); --warn:#A8620A; --warn-soft:rgba(168,98,10,.11); --bad:#C52A3E; --bad-soft:rgba(197,42,62,.09);
  --none:#C7D0E2; --shadow:0 1px 2px rgba(16,32,80,.05), 0 10px 28px -20px rgba(16,32,80,.35);
  --glow:radial-gradient(1100px 500px at 10% -10%, rgba(47,85,228,.10), transparent 60%), radial-gradient(800px 420px at 100% 0%, rgba(120,150,230,.10), transparent 55%);
  --header:rgba(238,242,249,.78);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--glow),linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);background-color:var(--bg);background-attachment:fixed;min-height:100%;transition:background-color .35s var(--ease)}
body{margin:0;background:transparent;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100vh;transition:background-color .35s var(--ease),color .35s var(--ease)}
a{color:var(--blue);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--blue-2)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:24px;padding-block:0 72px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--header);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap}
.brand{font-weight:600;letter-spacing:-.015em;font-size:15px;display:flex;align-items:center;gap:8px}
.brand .mark{position:relative;flex:none;width:32px;height:32px;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#2540E2,#5A82FF);box-shadow:0 6px 18px -6px #4C6FFF,inset 0 0 0 1px rgba(255,255,255,.18)}
.brand .mark::before{content:"";position:absolute;inset:4px;background:#fff;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}

@media (max-width:600px){.wrap,.top-in{padding-inline:16px} .top-right{margin-left:0;width:100%} nav.tabs{flex:1;overflow-x:auto} .stat b{font-size:24px}}

<body>
<header class="top"><div class="top-in">
  <div class="brand"><span class="mark" aria-hidden="true"></span><span>Accelerate <em>Marketing Ops</em></span> <span class="draft">Draft v1</span></div>

</div></header>
<main class="wrap" id="app">
  <div class="hero"><div><div class="eyebrow">Loading</div><h1>Pulling live <em>funnel</em> data from Notion</h1><p class="note">Reading PM Engine v2, the Project Tracker and the Strategy Board.</p></div></div>
</main>
<div id="toast-root"></div>

<script>
(function(){
/* ---------- constants ---------- */
const NOTION = "Notion";
const TOOL = "notion-query-data-sources";
const DS = {
  tracker: "collection://b6b396fe-f0cf-4d7e-9845-e18c630c0ae7",
  projects: "collection://2b1b6494-fc14-82b9-8659-872f524ab1fd",
  tasks: "collection://9acb6494-fc14-8290-af49-87a1c6c613ed",
  board: "collection://309b6494-fc14-8073-ae13-000b7a00ba6e"
};
const STAGES = ["Ads","Landing page","Lead magnet","CRM + automations","Nurture"];
const ADDONS = ["Meta Ads setup & Management","CRM Setup","Manychat Setup","Website Optimization","Website Build (From scratch)","Editing"];
const ISSUE_TO_ADDON = {
  "6.1":"Website Optimization","6.5":"CRM Setup","6.6":"Meta Ads setup & Management","6.7":"Manychat Setup","6.2":"Meta Ads setup & Management","6.4":"Meta Ads setup & Management"
};
const CUR = {USD:"$",AUD:"A$",LKR:"Rs ",GBP:"£",NZD:"NZ$",CAD:"C$"};
const STUCK_STATUSES = ["Need Feedback","Need Revision"];

/* ---------- state ---------- */
const S = {
  clients:[], projects:[], tasks:[], board:[],
  err:{core:null,tasks:null}, loading:true, loadedAt:null,
  ads:[], upsell:{}, adsOn:false, upsellOn:false, saving:false
};
const UI = {tab:"today", selCell:null, briefQ:"", adClient:"all"};
try{const t=localStorage.getItem("mo2-tab"); if(t) UI.tab=t;}catch(e){}
if(/^#(today|funnels|upsell|ads|briefs)$/.test(location.hash)) UI.tab=location.hash.slice(1);

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const id32=s=>{const m=String(s||"").replace(/-/g,"").match(/[0-9a-f]{32}/i);return m?m[0].toLowerCase():null};
const arr=v=>{if(Array.isArray(v))return v;if(v==null||v==="")return[];try{const x=JSON.parse(v);return Array.isArray(x)?x:[]}catch(e){return[]}};
const nlink=id=>"https://www.notion.so/"+id;
function iso(d){const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)}
const TODAY=iso(new Date());
function addDays(s,n){const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return iso(d)}
function diff(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5)}
function fmtDate(s){if(!s)return"";return new Date(s.slice(0,10)+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"})}
function money(v,c){if(v==null||isNaN(v))return"–";const sym=CUR[c]||"$";return sym+(v>=100?Math.round(v).toLocaleString():(+v).toFixed(2))}
function firstKey(name){const w=String(name||"").toLowerCase().replace(/[^a-z\s]/g," ").split(/\s+/).filter(x=>x&&x.length>2&&x!=="the");return w[0]||null}
function toast(msg){const r=$("#toast-root");r.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toast._t);toast._t=setTimeout(()=>{r.innerHTML=""},2200)}

/* ---------- data from /api (Notion token stays on the server) ---------- */
async function api(path,opts){
  opts=opts||{};
  const res=await fetch(path,{method:opts.method||"GET",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:opts.body?JSON.stringify(opts.body):undefined});
  let j={};try{j=await res.json()}catch(e){}
  if(!res.ok){const err=new Error(j.message||("Request failed ("+res.status+")"));err.code=j.error||res.status;throw err}
  return j;
}
function errText(e){
  if(e&&e.code==="locked")return{msg:"locked",retry:false};
  return{msg:(e&&e.message)||"Couldn't load data from Notion.",retry:true};
}
async function loadAll(fresh){
  S.loading=true;S.err.core=null;S.err.tasks=null;render();
  try{
    const d=await api("/api/data"+(fresh?"?fresh="+Date.now():""));
    S.clients=d.clients||[];S.projects=d.projects||[];S.tasks=d.tasks||[];S.board=d.board||[];
    S.locked=false;S.user=d.user&&d.user!=="open"?d.user:null;S.adsOn=Array.isArray(d.ads);S.upsellOn=!!d.upsell;
    const names={};S.clients.forEach(c=>{names[c.id]=c.name});
    S.ads=(d.ads||[]).map(a=>Object.assign({},a,{clientName:names[a.clientId]||"Unknown client"}));

/* ---------- derived ---------- */
const clientById=id=>S.clients.find(c=>c.id===id);
const isOpen=t=>t.status!=="Done";
const isOverdue=t=>isOpen(t)&&t.due&&t.due.slice(0,10)<TODAY;
const isStuck=t=>isOpen(t)&&(STUCK_STATUSES.includes(t.status)||isOverdue(t));
function projectsFor(cid){return S.projects.filter(p=>p.clientIds.includes(cid))}
function tasksFor(cid){const pids=new Set(projectsFor(cid).map(p=>p.id));return S.tasks.filter(t=>t.projectIds.some(x=>pids.has(x)))}
function clientOfTask(t){const p=S.projects.find(p=>t.projectIds.includes(p.id));return p?clientById(p.clientIds[0]):null}
function funnelClients(){return S.clients.filter(c=>projectsFor(c.id).length)}
function stageState(cid,st){
  const ts=tasksFor(cid).filter(t=>t.stage===st);
  const open=ts.filter(isOpen),done=ts.length-open.length;
  let state="empty";
  if(open.some(isStuck))state="stuck";else if(open.length)state="active";else if(done)state="done";
  return{state,open:open.length,done,tasks:ts};
}
const STATE_LABEL={done:"Done",active:"In progress",stuck:"Stuck",empty:"Not started"};
function boardFor(c){
  const k=firstKey(c.name);if(!k)return[];
  return S.board.filter(b=>String(b.client||"").toLowerCase().includes(k)||String(b.title||"").toLowerCase().includes(k));
}
function upsellInfo(c){
  const day=c.start?diff(c.start.slice(0,10),TODAY)+1:null;
  const missing=ADDONS.filter(a=>!c.addons.includes(a));
  const signals=[];
  if(day!=null&&day>=60&&day<=90)signals.push({kind:"warn",text:"Day "+day+" of 90: renewal window"});
  else if(day!=null&&day>90)signals.push({kind:"warn",text:"Past day 90 (day "+day+")"});
  const code=c.issue?String(c.issue).slice(0,3):null;
  if(code&&ISSUE_TO_ADDON[code]&&missing.includes(ISSUE_TO_ADDON[code]))signals.push({kind:"bad",text:"Blocker "+code+" → offer "+ISSUE_TO_ADDON[code]});
  if(c.pstage==="Funnel Creation & Ad Setup"&&missing.includes("Meta Ads setup & Management"))signals.push({kind:"blue",text:"In funnel & ad setup, no ads add-on yet"});
  const cp=S.upsell[c.id]||null;
  let due=false;
  if(cp&&cp.nextDate&&cp.status!=="won"&&cp.status!=="declined"){const d=diff(TODAY,cp.nextDate);due=d<=7;}
  return{day,missing,signals,cp,due};
}
function adStats(cid){
  const logs=S.ads.filter(a=>a.clientId===cid);
  const range=(a,b)=>logs.filter(l=>l.date>=a&&l.date<=b);
  const sum=(xs,k)=>xs.reduce((s,l)=>s+(+l[k]||0),0);
  const w=range(addDays(TODAY,-7),addDays(TODAY,-1)),p=range(addDays(TODAY,-14),addDays(TODAY,-8));
  const s7=sum(w,"spend"),r7=sum(w,"results"),sp=sum(p,"spend"),rp=sum(p,"results");
  const latest=logs.slice().sort((a,b)=>a.date<b.date?1:-1)[0];
  return{count:logs.length,s7,r7,cpr7:r7>0?s7/r7:null,cprP:rp>0?sp/rp:null,cur:latest?latest.currency:"USD",label:latest?latest.resultLabel:"Leads",last:latest?latest.date:null};
}

    return '<div class="adcard"><div class="card-h"><b>'+esc(c.name)+'</b><span class="pill muted">'+esc(c.stage||"No stage")+'</span></div>'+
      '<div class="note">'+esc([c.pstage,c.po&&("PO "+c.po),c.strat&&("Strat "+c.strat)].filter(Boolean).join(" · "))+'</div>'+
      (goal?'<div><span class="note">Goal</span><div><b>'+esc(goal)+'</b></div></div>':'')+
      (items.length?'<div class="pills">'+items.slice(0,6).map(b=>'<a class="pill '+(b.status==="Approved"?"good":b.status==="Backlog"?"muted":"")+'" href="'+nlink(b.id)+'" target="_blank" rel="noopener">'+esc(b.type||b.title)+': '+esc(b.status||"")+'</a>').join("")+'</div>':'<div class="note">No Strategy Board items found for this name.</div>')+
      (brief?'<details class="edit"><summary>Read the brief</summary><div class="brief">'+esc(brief)+'</div></details>':'')+
      (links.length?'<div class="links">'+[...new Set(links)].join("")+'</div>':'')+'</div>';
  }).join("")+'</div>';
  h+='<p class="note" style="margin-top:12px">Strategy Board items are matched to clients by name, so a misspelt client name on the board can hide an item.</p>';
  return h;
}

/* ---------- motion, tab pill, theme ---------- */
function movePill(){const b=document.querySelector('#tabs button[aria-current="page"]'),p=$("#tab-pill");if(!b||!p)return;p.style.width=b.offsetWidth+"px";p.style.transform="translateX("+b.offsetLeft+"px)"}
function stagger(root){let n=0;root.querySelectorAll(".stat,.panel,.adcard,.row,tbody tr").forEach(el=>{el.style.setProperty("--i",Math.min(n++,14))})}
function countUp(root){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  root.querySelectorAll(".stat b").forEach(el=>{const end=+el.textContent;if(!(end>0))return;const t0=performance.now(),d=700;
    const step=t=>{const k=Math.min(1,(t-t0)/d),e=1-Math.pow(1-k,3);el.textContent=Math.round(end*e);if(k<1)requestAnimationFrame(step)};el.textContent="0";requestAnimationFrame(step)});
}
const ICON_SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICON_MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function paintThemeBtn(){const light=document.documentElement.getAttribute("data-theme")==="light";const b=$("#theme-btn");if(b)b.innerHTML=(light?ICON_MOON+"Dark":ICON_SUN+"Light")}
function toggleTheme(){const r=document.documentElement;const light=r.getAttribute("data-theme")!=="light";if(light)r.setAttribute("data-theme","light");else r.removeAttribute("data-theme");try{localStorage.setItem("mo2-theme",light?"light":"dark")}catch(e){}paintThemeBtn()}

function viewLogin(){
  return '<section class="login"><div class="login-card">'+
    '<span class="mark big" aria-hidden="true"></span>'+
    '<div class="eyebrow">Editoz Club</div><h1>Marketing <em>Ops</em></h1>'+
    '<p class="note">Sign in with your Editoz email and the team password.</p>'+
    '<form id="loginform" class="login-form" novalidate>'+
    '<label class="f" for="login-email">Work email<input id="login-email" name="email" type="email" autocomplete="username" placeholder="you@editozclub.com" required></label>'+
    '<label class="f" for="login-pass">Password<input id="login-pass" name="password" type="password" autocomplete="current-password" required></label>'+
    '<p class="login-err" id="login-err" role="alert"></p>'+
    '<button type="submit" class="primary">Sign in</button></form></div></section>';
}
function render(){
  document.body.classList.toggle("locked",!!S.locked);
  const who=$("#who");if(who){who.textContent=S.user||"";who.parentElement.hidden=!S.user}
  if(S.locked){const app=$("#app");if(!$("#loginform")){app.innerHTML='<div class="view enter">'+viewLogin()+'</div>';const em=$("#login-email");if(em)em.focus()}return}
  renderTabs();
  const app=$("#app");
  const views={today:viewToday,funnels:viewFunnels,upsell:viewUpsell,ads:viewAds,briefs:viewBriefs};
  const active=document.activeElement&&document.activeElement.id;
  const openDetails=[...document.querySelectorAll("details.edit[open] form")].map(f=>f.dataset.upsell);
  const kept={};app.querySelectorAll("#adform input[id],#adform select[id]").forEach(el=>{kept[el.id]=el.value});
  const anim=UI.anim;UI.anim=false;
  app.innerHTML='<div class="view'+(anim?' enter':'')+'">'+(views[UI.tab]||viewToday)()+'</div>';
  if(anim){stagger(app);countUp(app)}
  requestAnimationFrame(movePill);
  Object.keys(kept).forEach(id=>{const el=document.getElementById(id);if(el)el.value=kept[id]});
  openDetails.forEach(id=>{const f=document.querySelector('form[data-upsell="'+id+'"]');if(f)f.closest("details").open=true});
  if(active){const el=document.getElementById(active);if(el&&el.id==="brief-q"){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const tb=e.target.closest("#tabs button");if(tb){setTab(tb.dataset.tab);return}
  const go=e.target.closest("[data-tab-go]");if(go){setTab(go.dataset.tabGo);return}
  if(e.target.closest('[data-act="reload"]')){UI.animOnLoad=true;loadAll(true);return}
  if(e.target.closest("#theme-btn")){toggleTheme();return}
  if(e.target.closest("#signout")){try{await api("/api/login",{method:"POST",body:{logout:true}})}catch(x){}S.locked=true;S.user=null;S.clients=[];S.projects=[];S.tasks=[];S.board=[];S.ads=[];S.upsell={};render();return}
  const cell=e.target.closest("[data-cell]");if(cell){UI.selCell=UI.selCell===cell.dataset.cell?null:cell.dataset.cell;render();return}
  const clr=e.target.closest("[data-clear]");
  if(clr&&S.upsellOn){
    if(!clr.classList.contains("armed")){clr.classList.add("armed");clr.textContent="Confirm remove";setTimeout(()=>{if(clr.isConnected){clr.classList.remove("armed");clr.textContent="Remove checkpoint"}},3000);return}
    clr.disabled=true;
    try{await api("/api/upsell?clientId="+encodeURIComponent(clr.dataset.clear),{method:"DELETE"});toast("Checkpoint removed");loadAll(true)}catch(x){toast("Couldn't remove: "+x.message);clr.disabled=false}
    return;
  }
  const del=e.target.closest("[data-del]");
  if(del&&S.adsOn){
    if(!del.classList.contains("armed")){del.classList.add("armed");del.textContent="Confirm";setTimeout(()=>{if(del.isConnected){del.classList.remove("armed");del.textContent="Delete"}},3000);return}
    try{await api("/api/ads?id="+encodeURIComponent(del.dataset.del),{method:"DELETE"});toast("Entry deleted");loadAll(true)}catch(x){toast("Couldn't delete: "+x.message)}
  }
});
document.addEventListener("input",e=>{if(e.target.id==="brief-q"){UI.briefQ=e.target.value;render()}});
document.addEventListener("submit",async e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==="loginform"){
    const err=$("#login-err"),btn=f.querySelector("button");err.textContent="";
    const email=f.email.value.trim(),password=f.password.value;
    if(!/@editozclub\.com$/i.test(email)){err.textContent="Use your @editozclub.com email.";return}
    if(!password){err.textContent="Enter the team password.";return}
    btn.disabled=true;btn.textContent="Signing in…";
    try{await api("/api/login",{method:"POST",body:{email,password}});UI.animOnLoad=true;S.locked=false;await loadAll(true)}
    catch(x){err.textContent=x.message||"Couldn't sign in.";btn.disabled=false;btn.textContent="Sign in";f.password.value="";f.password.focus()}
    return;
  }
  const btn=f.querySelector('button[type="submit"]');
  if(f.id==="adform"){
    if(!S.adsOn){toast("Ad logging is switched off");return}
    const d=Object.fromEntries(new FormData(f));const c=clientById(d.clientId);
    if(!c){toast("Choose a client");return}
    btn.disabled=true;
    try{
      await api("/api/ads",{method:"POST",body:{clientId:c.id,clientName:c.name,date:d.date,currency:d.currency,spend:+d.spend,results:+d.results,resultLabel:d.resultLabel,note:String(d.note||"").slice(0,300)}});
      toast("Entry added for "+c.name);
      f.querySelector("#ad-spend").value="";f.querySelector("#ad-res").value="";f.querySelector("#ad-note").value="";
      loadAll(true);
    }catch(x){toast("Couldn't save: "+x.message)}
    btn.disabled=false;return;
  }
  if(f.dataset.upsell){
    if(!S.upsellOn){toast("Checkpoints are switched off");return}
    const d=Object.fromEntries(new FormData(f));const c=clientById(f.dataset.upsell);
    btn.disabled=true;
    try{
      await api("/api/upsell",{method:"POST",body:{clientId:f.dataset.upsell,clientName:c?c.name:"",nextDate:d.nextDate,offer:d.offer||"",status:d.status||"planned",note:String(d.note||"").slice(0,400)}});
      toast("Checkpoint saved");f.closest("details").open=false;loadAll(true);
    }catch(x){toast("Couldn't save: "+x.message)}
    btn.disabled=false;
  }
});

/* ---------- boot ---------- */
UI.animOnLoad=true;
paintThemeBtn();
render();
loadAll(false);
window.addEventListener("resize",movePill);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(movePill);
})();
</script>
