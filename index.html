:root[data-theme="light"]{
  --bg:#EEF2F9; --bg-2:#F7F9FD; --surface:#FFFFFF; --surface-2:#F5F7FC; --raise:rgba(16,32,80,.025);
  --ink:#0C1830; --ink-2:#2A3956; --muted:#5D6B86; --line:rgba(16,32,80,.09); --line-strong:rgba(16,32,80,.17);
  --blue:#2F55E4; --blue-2:#1C3FBF; --blue-ink:#FFFFFF; --blue-soft:rgba(47,85,228,.09);
  --good:#178248; --good-soft:rgba(23,130,72,.10); --warn:#A8620A; --warn-soft:rgba(168,98,10,.11); --bad:#C52A3E; --bad-soft:rgba(197,42,62,.09);
  --none:#C7D0E2; --shadow:0 1px 2px rgba(16,32,80,.05), 0 10px 28px -20px rgba(16,32,80,.35);
  --glow:radial-gradient(1100px 500px at 10% -10%, rgba(47,85,228,.10), transparent 60%), radial-gradient(800px 420px at 100% 0%, rgba(120,150,230,.10), transparent 55%);
  --header:rgba(238,242,249,.78);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--glow),linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);background-color:var(--bg);background-attachment:fixed;min-height:100%;transition:background-color .35s var(--ease)}
body{margin:0;background:transparent;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100vh;transition:background-color .35s var(--ease),color .35s var(--ease)}
a{color:var(--blue);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--blue-2)}
.wrap{max-width:1240px;margin:0 auto;padding-inline:24px;padding-block:0 72px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--header);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap}
.brand{font-weight:600;letter-spacing:-.015em;font-size:15px;display:flex;align-items:center;gap:8px}
.brand .mark{position:relative;flex:none;width:32px;height:32px;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#2540E2,#5A82FF);box-shadow:0 6px 18px -6px #4C6FFF,inset 0 0 0 1px rgba(255,255,255,.18)}
.brand .mark::before{content:"";position:absolute;inset:4px;background:#fff;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.brand .mark::after{content:"";position:absolute;inset:-40%;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);transform:translateX(-120%);animation:sheen 5.5s var(--ease) 1.2s infinite}

.hero{position:relative;isolation:isolate}

nav.tabs .pill{position:absolute;top:4px;left:0;height:calc(100% - 8px);border-radius:9px;background:var(--surface-2);box-shadow:0 0 0 1px var(--line-strong),0 6px 18px -10px rgba(0,0,0,.6);transition:transform .38s var(--ease),width .38s var(--ease);z-index:0;pointer-events:none}
nav.tabs button{white-space:nowrap;position:relative;z-index:1;color:var(--muted);background:none;border:0;font:inherit;font-weight:500;font-size:13px;padding:7px 14px;border-radius:9px;cursor:pointer;transition:color .2s}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--bad);color:var(--blue-ink);font-family:var(--mono);font-size:10.5px;line-height:17px;text-align:center}
.theme-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--ink-2);font:inherit;font-size:12.5px;font-weight:500;cursor:pointer}

.theme-btn:hover{color:var(--ink);border-color:var(--line-strong)}

/* page heading + stat tiles */
.hero{padding-block:30px 18px;display:flex;flex-direction:column;gap:18px}
.hero-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
h1{font-size:clamp(26px,3.2vw,34px);line-height:1.1;letter-spacing:-.03em;font-weight:600;margin:8px 0 0;text-wrap:balance}

.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--gap)}

@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:last-child:nth-child(odd){grid-column:1 / -1}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}

.stat span{font-size:12px;color:var(--muted);font-weight:500}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)}
.stat.bad{background:linear-gradient(180deg,var(--bad-soft),transparent 70%),var(--surface)}
.stat.warn{background:linear-gradient(180deg,var(--warn-soft),transparent 70%),var(--surface)}

/* panels + grid */
.grid{display:grid;gap:var(--gap)}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
@media (max-width:900px){.g-2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:var(--gap)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);min-width:0;box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;min-height:32px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.panel-h + .row,.row:first-child{border-top:0;padding-top:4px}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .t a{color:var(--ink);text-decoration-color:var(--line-strong)}
.row .t a:hover{color:var(--blue)}
.row .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.sev{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--none)}
.sev.bad{background:var(--bad);box-shadow:0 0 0 4px var(--bad-soft)} .sev.warn{background:var(--warn);box-shadow:0 0 0 4px var(--warn-soft)} .sev.good{background:var(--good);box-shadow:0 0 0 4px var(--good-soft)} .sev.blue{background:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue);white-space:nowrap;text-decoration:none}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.good{background:var(--good-soft);color:var(--good)} .pill.muted{background:transparent;color:var(--muted);border:1px solid var(--line-strong)}
.pills{display:flex;gap:5px;flex-wrap:wrap}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.empty b{color:var(--ink-2);font-weight:600}
.note{font-size:12.5px;color:var(--muted)}
.banner{border-radius:var(--r-sm);padding:11px 14px;font-weight:500;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:var(--gap);border:1px solid transparent}
.banner.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-soft)}
.banner.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-soft)}
.banner.info{background:var(--blue-soft);color:var(--ink-2);border-color:var(--blue-soft)}

/* controls */
button,.btn{font:inherit;font-weight:500;font-size:13px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);padding:8px 14px;cursor:pointer;transition:border-color .2s,color .2s,background .2s,transform .15s}
button:hover{border-color:var(--blue);color:var(--blue)}
button:active{transform:translateY(1px)}
button.primary{background:linear-gradient(180deg,var(--blue),var(--blue-2));border-color:transparent;color:var(--blue-ink);box-shadow:0 8px 20px -10px var(--blue)}
button.primary:hover{filter:brightness(1.07);color:var(--blue-ink)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 10px}
button.ghost:hover{color:var(--blue);background:var(--blue-soft)}
button.danger{color:var(--bad)}
button.danger:hover{background:var(--bad-soft);color:var(--bad)}
button.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--blue-ink)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg-2);border:1px solid var(--line-strong);border-radius:9px;padding:8px 10px;min-width:0;max-width:100%;height:38px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--blue-soft)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-items:end}
.form label.f.wide{grid-column:span 2}
@media (max-width:520px){.form label.f.wide{grid-column:auto}}
.form button{height:38px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:var(--gap)}
.fresh{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

/* tables */
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:bottom}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{transition:background .2s}
tbody tr:hover{background:var(--raise)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
table.up-tbl{table-layout:fixed;min-width:960px}
table.up-tbl col.c1{width:17%} table.up-tbl col.c2{width:10%} table.up-tbl col.c3{width:22%} table.up-tbl col.c4{width:25%} table.up-tbl col.c5{width:26%}

/* funnel map */
table.map{table-layout:fixed;min-width:860px}
table.map col.cname{width:20%} table.map col.cstage{width:14%} table.map col.copen{width:10%}
.map td{padding:5px;vertical-align:middle}
.map td.name{font-weight:600;padding-right:14px}
.mapcell{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--raise);height:62px;font-weight:500;color:var(--ink)}
.mapcell:hover{border-color:var(--line-strong);color:var(--ink);transform:translateY(-1px)}
.mapcell .s{font-size:12px;font-weight:600}
.mapcell .c{font-family:var(--mono);font-size:11px;color:var(--muted)}
.mapcell.done{background:var(--good-soft);border-color:transparent}.mapcell.done .s{color:var(--good)}
.mapcell.active{background:var(--blue-soft);border-color:transparent}.mapcell.active .s{color:var(--blue)}
.mapcell.stuck{background:var(--bad-soft);border-color:transparent}.mapcell.stuck .s{color:var(--bad)}
.mapcell.empty .s{color:var(--muted)}
.mapcell.sel{box-shadow:0 0 0 2px var(--blue)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:500}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--gap);align-items:stretch}
.adcard{border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);background:var(--surface);display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow);transition:transform .25s var(--ease),border-color .25s}
.adcard:hover{transform:translateY(-2px);border-color:var(--line-strong)}
.adcard .kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.adcard .kpis div b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em}
.adcard .kpis div span{font-family:var(--mono);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.up{color:var(--bad);font-weight:600} .down{color:var(--good);font-weight:600}
details.edit{margin-top:8px}
details.edit summary{cursor:pointer;font-size:12.5px;font-weight:500;color:var(--blue);list-style:none;display:inline-flex}
details.edit summary::-webkit-details-marker{display:none}
details.edit .form{margin-top:10px;padding:12px;border:1px dashed var(--line-strong);border-radius:var(--r-sm);grid-template-columns:repeat(2,minmax(0,1fr))}
details.edit .form label.f.wide{grid-column:1 / -1}
details[open] .form{animation:pop .28s var(--ease) both}
.brief{font-size:13px;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto;background:var(--raise);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;margin-top:8px}
.links{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;font-weight:500;margin-top:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface-2);color:var(--ink);border:1px solid var(--line-strong);padding:10px 18px;border-radius:999px;font-weight:500;font-size:13px;z-index:60;box-shadow:0 18px 40px -18px rgba(0,0,0,.7);animation:toast .35s var(--ease) both}

/* ads + pitch + decks */
.stats.s3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:520px){.stats.s3{grid-template-columns:minmax(0,1fr)}}
.sub-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px;padding-top:12px;border-top:1px solid var(--line)}
table.log-tbl{table-layout:fixed;min-width:720px}
table.log-tbl col.l1{width:24%} table.log-tbl col.l2{width:14%} table.log-tbl col.l3{width:14%} table.log-tbl col.l4{width:34%}
.log-tbl td{vertical-align:middle;padding:8px 10px}
.log-tbl input{width:100%;height:36px}
.log-tbl input[type=number]{text-align:right;font-family:var(--mono)}
.cpr{font-family:var(--mono);font-weight:500}
.good-t{color:var(--good);font-weight:600}
.spark{width:100%;height:56px;display:block;overflow:visible}
.spark-line{fill:none;stroke:var(--blue);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.spark-area{fill:var(--blue-soft);stroke:none}
.spark-dot{fill:var(--blue);stroke:var(--surface);stroke-width:2}

.spark-empty{min-height:56px;display:flex;align-items:center}
.flags{display:flex;flex-wrap:wrap;gap:5px}
.flags .pill{white-space:normal}
details.settings{margin-top:var(--gap)}
details.settings>summary{list-style:none;cursor:pointer}
details.settings>summary::-webkit-details-marker{display:none}
details.settings>summary h2::after{content:"Show";margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--blue)}
details.settings[open]>summary h2::after{content:"Hide"}
details.settings>summary h2{width:100%}
details.settings[open]>summary{margin-bottom:12px}
.set-tbl{min-width:760px}
.set-tbl td{vertical-align:middle;padding:8px 10px}
.set-tbl select,.set-tbl input{height:34px}
.set-tbl input[type=number]{width:120px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--blue)}
table.map col.cname{width:16%} table.map col.cstage{width:11.5%} table.map col.copen{width:6%} table.map col.cpitch{width:20.5%}
table.map{min-width:1040px}
.pitch-cell{vertical-align:middle}
.pitch-in{width:100%;min-height:52px;height:auto;resize:vertical;font-size:12.5px;line-height:1.4;padding:7px 9px;display:block;margin-top:2px}
.pitch-in.saving{opacity:.6}
.pitch-in.saved{border-color:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.deck-list{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.deck{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--raise);color:var(--ink);text-decoration:none;font-size:13px;font-weight:500;transition:border-color .2s,transform .2s}
.deck:hover{border-color:var(--blue);color:var(--ink);transform:translateX(2px)}
.deck-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deck-ic{flex:none;width:18px;height:22px;border-radius:3px;background:linear-gradient(160deg,var(--blue),var(--blue-2));position:relative}
.deck-ic::after{content:"";position:absolute;left:4px;right:4px;top:6px;height:2px;background:var(--surface);box-shadow:0 4px 0 var(--surface),0 8px 0 var(--surface)}

/* sign-in */
body.locked nav.tabs,body.locked .user-chip{display:none}
.user-chip{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 4px 0 12px;border-radius:10px;border:1px solid var(--line);background:var(--raise);font-size:12.5px;color:var(--ink-2);max-width:280px}

.login{min-height:calc(100vh - 140px);display:grid;place-items:center;padding-block:40px}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px 28px;box-shadow:var(--shadow),0 30px 80px -40px rgba(60,100,255,.45);display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.login-card::before{content:"";position:absolute;right:-60px;top:-40px;width:220px;aspect-ratio:1.4;background:linear-gradient(135deg,var(--blue),transparent);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;opacity:.12;pointer-events:none}
.login-card h1{margin:4px 0 2px}
.mark.big{position:relative;width:46px;height:46px;border-radius:13px;overflow:hidden;background:linear-gradient(135deg,#2540E2,#5A82FF);box-shadow:0 10px 26px -8px #4C6FFF,inset 0 0 0 1px rgba(255,255,255,.18);margin-bottom:14px}
.mark.big::before{content:"";position:absolute;inset:6px;background:#fff;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.login-form{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.login-form button{height:42px;font-size:14px}

/* motion */
@keyframes sheen{0%{transform:translateX(-120%)}22%,100%{transform:translateX(120%)}}
@keyframes drift{from{transform:translateY(0) rotate(0)}to{transform:translateY(8px) rotate(-3deg)}}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}

.view.enter{animation:viewIn .42s var(--ease) both}

@media (max-width:600px){.wrap,.top-in{padding-inline:16px} .top-right{margin-left:0;width:100%} nav.tabs{flex:1;overflow-x:auto} .stat b{font-size:24px}}

/* ---- v2 layout (Oshara's mockups) ---- */

<body>
<header class="top"><div class="top-in">
  <div class="brand"><span class="mark" aria-hidden="true"></span><span>Accelerate <em>Marketing Ops</em></span></div>
  <div class="top-right">
    <nav class="tabs" id="tabs" aria-label="Sections">
      <span class="pill" id="tab-pill" aria-hidden="true"></span>
      <button data-tab="today" type="button">Today</button>
      <button data-tab="funnels" type="button">Funnels</button>
      <button data-tab="upsell" type="button">Upsell</button>
      <button data-tab="ads" type="button">Ads</button>
      <button data-tab="briefs" type="button">Briefs</button>

    <span class="user-chip" hidden><span id="who"></span><button type="button" class="ghost" id="signout">Sign out</button></span>

  </div>
</div></header>
<main class="wrap" id="app">
  <div class="hero"><div><div class="eyebrow">Loading</div><h1>Pulling live data from Notion</h1></div></div>
</main>
<div id="toast-root"></div>

<script>
(function(){
/* ---------- constants ---------- */
const STAGES = ["Ads","Landing page","Lead magnet","CRM + automations","Nurture"];
const STAGE_SHORT = {"CRM + automations":"CRM"};
const ADDONS = ["Meta Ads setup & Management","CRM Setup","Manychat Setup","Website Optimization","Website Build (From scratch)","Editing"];
const ADDON_LABEL = {"Meta Ads setup & Management":"Meta Ads setup + management","CRM Setup":"CRM setup","Manychat Setup":"ManyChat setup","Website Optimization":"Website optimisation","Website Build (From scratch)":"Website build","Editing":"Editing"};
const ISSUE_TO_ADDON = {"6.1":"Website Optimization","6.5":"CRM Setup","6.6":"Meta Ads setup & Management","6.7":"Manychat Setup","6.2":"Meta Ads setup & Management","6.4":"Meta Ads setup & Management"};
const ROUTES = ["Gap","Win","Client ask"];
const ROUTE_CLS = {Gap:"warn",Win:"good","Client ask":""};
const CUR = {USD:"$",AUD:"A$",LKR:"Rs ",GBP:"£",NZD:"NZ$",CAD:"C$"};
const STUCK_STATUSES = ["Need Feedback","Need Revision"];
const RESULT_TYPES = ["Leads","Purchases","Bookings","Messages","Results"];
const COST_LABEL = {Leads:"Cost / lead",Purchases:"Cost / purchase",Bookings:"Cost / booking",Messages:"Cost / message",Results:"Cost / result"};

/* ---------- state ---------- */
const S = {clients:[],projects:[],tasks:[],archive:[],ads:[],upsell:{},adClients:{},err:{core:null},loading:true,loadedAt:null,adsOn:false,upsellOn:false,adClientsOn:false};
const UI = {tab:"today",selCell:null,briefQ:"",manage:{},blkOpen:{},showUntagged:false,editUp:{}};
try{const t=localStorage.getItem("mo2-tab"); if(t) UI.tab=t;}catch(e){}
if(/^#(today|funnels|upsell|ads|briefs)$/.test(location.hash)) UI.tab=location.hash.slice(1);

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nlink=id=>"https://www.notion.so/"+id;
function iso(d){const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)}
const TODAY=iso(new Date());
const YESTERDAY=addDays(TODAY,-1);
function addDays(s,n){const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return iso(d)}
function diff(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5)}
function fmtDate(s){if(!s)return"";return new Date(s.slice(0,10)+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"})}
function fmtDay(s){return new Date(s.slice(0,10)+"T00:00:00").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}
function weekday(s){return new Date(s+"T00:00:00").toLocaleDateString("en-GB",{weekday:"long"})}
function money(v,c){if(v==null||isNaN(v))return"–";const sym=CUR[c]||"$";return sym+(v>=100?Math.round(v).toLocaleString():(+v).toFixed(2))}
function compact(n){n=+n;if(!isFinite(n))return"";const f=(v,s)=>(Math.round(v*10)/10).toString().replace(/\.0$/,"")+s;return n>=1e6?f(n/1e6,"M"):n>=1e3?f(n/1e3,"K"):String(n)}
function toast(msg){const r=$("#toast-root");r.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toast._t);toast._t=setTimeout(()=>{r.innerHTML=""},2400)}
const plural=(n,a,b)=>n+" "+(n===1?a:(b||a+"s"));

/* ---------- data from /api (Notion token stays on the server) ---------- */
async function api(path,opts){
  opts=opts||{};
  const res=await fetch(path,{method:opts.method||"GET",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:opts.body?JSON.stringify(opts.body):undefined});
  let j={};try{j=await res.json()}catch(e){}
  if(!res.ok){const err=new Error(j.message||("Request failed ("+res.status+")"));err.code=j.error||res.status;throw err}
  return j;
}
async function loadAll(fresh){
  S.loading=true;S.err.core=null;render();
  try{
    const d=await api("/api/data"+(fresh?"?fresh="+Date.now():""));
    S.clients=d.clients||[];S.projects=d.projects||[];S.tasks=d.tasks||[];S.board=d.board||[];
    S.archive=d.archive||[];S.archiveError=d.archiveError||null;S.bookingUrl=d.bookingUrl||null;
    S.locked=false;S.user=d.user&&d.user!=="open"?d.user:null;
    S.adsOn=Array.isArray(d.ads);S.upsellOn=!!d.upsell;S.adClientsOn=!!d.adClients;
    const names={};S.clients.forEach(c=>{names[c.id]=c.name});
    S.ads=(d.ads||[]).map(a=>Object.assign({},a,{clientName:names[a.clientId]||"Unknown client"}));
    S.upsell=d.upsell||{};S.adClients=d.adClients||{};
    S.loadedAt=Date.parse(d.loadedAt)||Date.now();
  }catch(e){if(e&&e.code==="locked"){S.locked=true;S.user=null}else S.err.core={msg:(e&&e.message)||"Couldn't load data from Notion."}}
  S.loading=false;if(UI.animOnLoad){UI.anim=true;UI.animOnLoad=false}render();
}

/* ---------- derived ---------- */
const clientById=id=>S.clients.find(c=>c.id===id);
const isOpen=t=>t.status!=="Done";
const isOverdue=t=>isOpen(t)&&t.due&&t.due.slice(0,10)<TODAY;
const isStuck=t=>isOpen(t)&&(STUCK_STATUSES.includes(t.status)||isOverdue(t));
const lateDays=t=>diff(t.due.slice(0,10),TODAY);
function projectsFor(cid){return S.projects.filter(p=>p.clientIds.includes(cid))}
function tasksFor(cid){const pids=new Set(projectsFor(cid).map(p=>p.id));return S.tasks.filter(t=>t.projectIds.some(x=>pids.has(x)))}
function clientOfTask(t){const p=S.projects.find(p=>t.projectIds.includes(p.id));return p?clientById(p.clientIds[0]):null}
// The one client list every tab uses: clients with a live PM Engine project (Client set, not Paused/Done).
function funnelClients(){return S.clients.filter(c=>projectsFor(c.id).length)}
function subLine(c,extra){return [projectsFor(c.id).map(p=>p.name).join(", ")].concat(extra||[]).concat(c.po?["PO "+c.po]:[]).filter(Boolean).join(" · ")}
function archiveFor(cid){return S.archive.filter(a=>a.clientId===cid).sort((a,b)=>String(a.stage).localeCompare(String(b.stage)))}
function phaseNum(s){const m=/phase\s*0?(\d)/i.exec(s||"");return m?+m[1]:null}
function phaseOf(c){const n=phaseNum(c.stage);if(n)return n;const a=archiveFor(c.id);return a.length?phaseNum(a[a.length-1].stage):null}
const phaseLabel=n=>n?"Phase 0"+n:null;

function stageState(cid,st){
  const ts=tasksFor(cid).filter(t=>t.stage===st);
  const open=ts.filter(isOpen),done=ts.length-open.length;
  let state="empty";
  if(open.some(isStuck))state="stuck";else if(open.length)state="active";else if(done)state="done";
  return{state,open:open.length,done,tasks:ts};
}
function nextTask(cid){
  const open=tasksFor(cid).filter(isOpen);
  open.sort((a,b)=>(isOverdue(b)-isOverdue(a))||((a.due||"9")<(b.due||"9")?-1:(a.due||"9")>(b.due||"9")?1:0));
  return open[0]||null;
}

/* upsell: route + suggested offer, editable and saved to Upsell Checkpoints */
function bundle(addon,c){
  const base=ADDON_LABEL[addon]||addon;
  return addon!=="CRM Setup"&&!c.addons.includes("CRM Setup")&&addon!=="Meta Ads setup & Management"?base+" + CRM bundle":base;
}
function autoUpsell(c){
  const code=c.issue?String(c.issue).slice(0,3):null;
  const addon=code&&ISSUE_TO_ADDON[code];
  if(addon&&!c.addons.includes(addon)){
    const txt=String(c.issue).replace(/^\s*\d+\.\d+\s*[-–:.]?\s*/,"").trim();
    return{route:"Gap",offer:bundle(addon,c),reason:(txt?txt.charAt(0).toUpperCase()+txt.slice(1,70)+(txt.length>70?"…":""):"Funnel blocker")+" ("+code+")."};
  }
  if(c.pstage==="Funnel Creation & Ad Setup"&&!c.addons.includes("Meta Ads setup & Management"))
    return{route:"Gap",offer:c.addons.includes("CRM Setup")?"Ads management":"Ads management + CRM bundle",reason:"In ad setup with no ads add-on."};
  const last=archiveFor(c.id).slice(-1)[0];
  if(last&&last.progress!=null){const pct=last.progress>1.5?last.progress:last.progress*100;
    if(pct>=100){const next=["Meta Ads setup & Management","CRM Setup","Manychat Setup"].find(a=>!c.addons.includes(a));
      return{route:"Win",offer:next?"Next phase + "+ADDON_LABEL[next]:"Next phase renewal",reason:"Hit "+Math.round(pct)+"% of the "+(last.stage||"last phase")+" goal."}}}
  return{route:"",offer:"",reason:""};
}
function upsellInfo(c){
  const day=c.start?diff(c.start.slice(0,10),TODAY)+1:null;
  const cp=S.upsell[c.id]||null;
  const auto=autoUpsell(c);
  const route=(cp&&cp.route)||auto.route;
  const offer=(cp&&cp.offer)||auto.offer;
  const reason=auto.reason||(cp&&cp.note)||"";
  const closed=!!(cp&&["won","declined"].includes(cp.status));
  const closedThisWeek=closed&&cp.nextDate&&Math.abs(diff(TODAY,cp.nextDate))<=7;
  const callBooked=!closed&&cp&&cp.nextDate&&cp.nextDate>=TODAY;
  const act=!closed&&(callBooked||(route&&(day==null||day>=30))||(day!=null&&day>=60));
  const coming=!closed&&!act&&(!!route||(day!=null&&day>=20));
  return{day,cp,auto,route,offer,reason,closed,closedThisWeek,callBooked,act,coming};
}

/* ads */
function adSet(cid){return (S.adClients&&S.adClients[cid])||null}
function runningClients(){return funnelClients().filter(c=>{const s=adSet(c.id);return s&&s.running})}
function adInfo(cid){
  const set=adSet(cid);
  const logs=S.ads.filter(a=>a.clientId===cid).sort((a,b)=>a.date<b.date?-1:1);
  const latest=logs[logs.length-1];
  const label=(set&&set.resultLabel)||(latest&&latest.resultLabel)||"Leads";
  const cur=(set&&set.currency)||(latest&&latest.currency)||"AUD";
  const target=set&&set.target!=null&&set.target!==""?+set.target:null;
  const inRange=(a,b)=>logs.filter(l=>l.date>=a&&l.date<=b);
  const sum=(xs,k)=>xs.reduce((s,l)=>s+(+l[k]||0),0);
  const w=inRange(addDays(TODAY,-7),YESTERDAY),p=inRange(addDays(TODAY,-14),addDays(TODAY,-8));
  const s7=sum(w,"spend"),r7=sum(w,"results"),sp=sum(p,"spend"),rp=sum(p,"results");
  const cpr7=r7>0?s7/r7:null,cprP=rp>0?sp/rp:null;
  const change=cpr7!=null&&cprP!=null?(cpr7/cprP-1)*100:null;
  const over=target!=null&&cpr7!=null&&cpr7>target;
  const costUp=change!=null&&change>25;
  const noResults=s7>0&&r7===0;
  const loggedYesterday=logs.some(l=>l.date===YESTERDAY);
  let status="ok";
  if(over)status="over";else if(costUp||noResults)status="check";else if(!loggedYesterday)status="notlogged";else if(!w.length)status="nodata";
  let note;
  if(over||costUp)note=change!=null&&change>0?"Cost up "+Math.round(change)+"% on last week.":"Cost per "+label.toLowerCase().replace(/s$/,"")+" is above target.";
  else if(noResults)note=money(s7,cur)+" spent this week with no "+label.toLowerCase()+".";
  else if(!loggedYesterday)note=weekday(YESTERDAY)+" not logged yet.";
  else if(!w.length)note="Nothing logged this week yet.";
  else note=target!=null?"Under target.":"Looking steady.";
  const lastNote=logs.slice().reverse().find(l=>l.note);
  if(lastNote&&status==="ok")note="Last change ("+fmtDate(lastNote.date)+"): "+lastNote.note;
  const series=inRange(addDays(TODAY,-14),YESTERDAY).filter(l=>l.results>0).map(l=>({d:l.date,v:l.spend/l.results}));
  return{set,label,cur,target,s7,r7,cpr7,change,over,status,note,loggedYesterday,series,last:latest?latest.date:null,logs};
}
const AD_PILL={over:'<span class="pill bad">Over target</span>',check:'<span class="pill bad">Check</span>',notlogged:'<span class="pill warn">Not logged</span>',nodata:'<span class="pill muted">No data</span>',ok:'<span class="pill good">On track</span>'};
function spark(series,target,bad){
  if(series.length<2)return'<div class="spark-empty note">Trend shows after 2 days of results.</div>';
  const W=140,H=48,pad=4,vals=series.map(s=>s.v).concat(target!=null?[target]:[]);
  const mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;
  const x=i=>pad+i*(W-2*pad)/(series.length-1),y=v=>H-pad-(v-mn)*(H-2*pad)/rng;
  const pts=series.map((s,i)=>x(i).toFixed(1)+","+y(s.v).toFixed(1)).join(" ");
  return '<svg class="spark'+(bad?" bad":"")+'" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true">'+
    (target!=null?'<line x1="0" x2="'+W+'" y1="'+y(target).toFixed(1)+'" y2="'+y(target).toFixed(1)+'" class="spark-target"/>':'')+
    '<polyline points="'+pts+'" class="spark-line"/></svg>';
}

        '<label class="f">Spend '+(date===YESTERDAY?"yesterday":fmtDate(date))+'<input type="number" min="0" step="0.01" inputmode="decimal" id="sp-'+c.id+'" value="'+(e.id?esc(e.spend):"")+'" placeholder="'+esc(a.cur)+'"></label>'+
        '<label class="f">'+esc(a.label)+' '+(date===YESTERDAY?"yesterday":fmtDate(date))+'<input type="number" min="0" step="1" inputmode="numeric" id="rs-'+c.id+'" value="'+(e.id?esc(e.results):"")+'" placeholder="0"></label>'+
        '<label class="f wide">What changed<span class="lf-row"><input id="nt-'+c.id+'" value="'+esc(e.note||"")+'" placeholder="New creative, budget up…"><button type="submit" class="primary"'+(S.adsOn?"":" disabled")+'>'+(e.id?"Update":"Log")+'</button></span></label>'+
      '</form>'+
      '<div class="card-f"><span class="note">'+lastTxt+'</span><button type="button" class="linkbtn" data-manage="'+c.id+'">'+(UI.manage[c.id]?"Close":"Manage")+'</button></div>'+
      (UI.manage[c.id]?setForm(c):'')+'</section>';
  }).join("")+'</div>';
  // Funnel clients not running ads
  const off=funnelClients().filter(c=>!(adSet(c.id)&&adSet(c.id).running));
  if(off.length)h+='<details class="panel later-p"'+(UI.offOpen?" open":"")+' id="off-panel"><summary><h2>Not running ads <span class="sub">'+off.length+'</span></h2></summary>'+off.map(c=>'<div class="off-row"><div><b>'+esc(c.name)+'</b><div class="note">'+esc(subLine(c))+'</div></div><button type="button" class="ghost" data-manage="'+c.id+'">'+(UI.manage[c.id]?"Close":"Set up")+'</button></div>'+(UI.manage[c.id]?setForm(c):'')).join("")+'</details>';
  // Recent entries (for fixing mistakes)
  const ids=new Set(funnelClients().map(c=>c.id));
  const recent=S.ads.filter(a=>ids.has(a.clientId)).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0).slice(0,30);
  if(recent.length)h+='<details class="panel later-p" id="recent-panel"'+(UI.recentOpen?" open":"")+'><summary><h2>Recent entries <span class="sub">'+recent.length+'</span></h2></summary><div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Client</th><th class="r">Spend</th><th class="r">Results</th><th class="r">Cost / result</th><th>What changed</th><th></th></tr></thead><tbody>'+
    recent.map(a=>'<tr><td>'+fmtDate(a.date)+'</td><td>'+esc(a.clientName)+'</td><td class="r">'+money(a.spend,a.currency)+'</td><td class="r">'+esc(a.results)+'</td><td class="r">'+(a.results>0?money(a.spend/a.results,a.currency):"–")+'</td><td>'+esc(a.note||"")+'</td><td class="r"><button type="button" class="ghost danger" data-del="'+esc(a.id)+'"'+(S.adsOn?"":" disabled")+'>Delete</button></td></tr>').join("")+'</tbody></table></div></details>';
  return h+footer();
}

/* ---------- Briefs ---------- */
function goalText(a){
  if(!a||a.goal==null)return null;
  const m=String(a.metric||"").replace(/^accumulated\s+/i,"").trim().toLowerCase();
  return compact(a.goal)+(m?" "+m:"")+" in 90 days";
}
/* Strategy Board has no client relation, so match on whole names:
   the board's Client Name must equal the client's name or be the start of it ("Vivek" → "Vivek Krishnan"),
   and must point to exactly one active client. Rows with no Client Name match only if the title holds the full name. */
const normTok=s=>String(s||"").toLowerCase().replace(/\(.*?\)/g," ").replace(/&/g," and ").replace(/[^a-z0-9\s]/g," ").split(/\s+/).filter(Boolean);
const startsWith=(a,b)=>b.length>0&&b.length<=a.length&&b.every((t,i)=>a[i]===t);
const containsSeq=(a,b)=>{if(!b.length||b.length>a.length)return false;for(let i=0;i+b.length<=a.length;i++)if(b.every((t,j)=>a[i+j]===t))return true;return false};
// "Vivek" ~ "Vivek Krishnan", "Pramod Mudalagiri gowda" ~ "Pramod Mudalagiri", "Dilan Jay" ~ "Dilan Jayasingha"
function nameMatch(a,b){const[sh,lo]=a.length<=b.length?[a,b]:[b,a];if(!sh.length)return false;
  return sh.every((t,i)=>t===lo[i]||(i===sh.length-1&&i>0&&t.length>=3&&lo[i].startsWith(t))||(i===0&&sh.length===1&&t.length>=4&&lo[0].startsWith(t)))}
let _boardMap=null,_boardSrc=null;
function boardMap(){
  if(_boardSrc===S.board&&_boardMap)return _boardMap;
  const map={},cl=S.clients.map(c=>({id:c.id,t:normTok(c.name)})).filter(x=>x.t.length);
  S.board.forEach(b=>{
    if(["Style Guide","Ideation"].includes(b.type))return;
    if(/style guide|brand guid|ideation/i.test(b.title||""))return;
    const bt=normTok(b.client);let hits=bt.length?cl.filter(c=>nameMatch(c.t,bt)):[];
    if(!hits.length){const tt=normTok(b.title);hits=cl.filter(c=>(c.t.length>=2||c.t[0].length>=5)&&containsSeq(tt,c.t))}
    if(hits.length===1)(map[hits[0].id]=map[hits[0].id]||[]).push(b);
  });
  _boardSrc=S.board;_boardMap=map;return map;
}
function boardFor(c){return (boardMap()[c.id]||[]).slice().sort((a,b)=>(b.created||"")<(a.created||"")?-1:1)}
function decksFor(c){
  const out=[],seen=new Set();
  const add=(label,url,meta)=>{if(!url||seen.has(url))return;seen.add(url);out.push({label,url,meta})};
  archiveFor(c.id).forEach(a=>add((phaseNum(a.stage)?"Phase "+phaseNum(a.stage):a.stage||"Phase")+" strategy deck",a.deck,"Phase archive"));
  // A Phase 1 client's first untagged creative strategy is their Phase 1 deck; keep the board title in the meta line so it can be checked.
  const p1=phaseOf(c)===1&&!archiveFor(c.id).length?boardFor(c).filter(b=>!phaseNum(b.title)&&b.deck&&(b.type==="Creative Strategy"||!b.type)).slice(-1)[0]:null;
  boardFor(c).forEach(b=>{
    if(b===p1){add("Phase 1 strategy deck",b.deck,String(b.title||"").trim()+(b.created?" · "+new Date(b.created+"T00:00:00").toLocaleDateString("en-GB",{month:"short",year:"numeric"}):""));return}
    const n=phaseNum(b.title);
    const label=n?"Phase "+n+(b.type==="Ad Strategy"?" ad strategy deck":" strategy deck"):b.type==="Ad Strategy"?"Ad strategy deck":b.type==="Pivot Call"?"Pivot call deck":String(b.title||"Strategy deck").replace(/\s+/g," ").trim();
    add(label,b.deck,"Strategy Board"+(b.created?" · "+new Date(b.created+"T00:00:00").toLocaleDateString("en-GB",{month:"short",year:"numeric"}):""));
  });
  if(c.deck&&!seen.has(c.deck)){const n=phaseOf(c);add(n&&!out.some(d=>d.label.startsWith("Phase "+n+" "))?"Phase "+n+" strategy deck":"Current strategy deck",c.deck,"Project Tracker")}
  return out;
}
function viewBriefs(){
  const q=UI.briefQ.trim().toLowerCase();
  const all=funnelClients();
  const list=all.filter(c=>!q||String(c.name).toLowerCase().includes(q));
  let h=hero("Funnel clients · Phase archive + Strategy Board","Briefs",'<label class="f" for="brief-q" style="min-width:240px">Find a client<input id="brief-q" type="search" value="'+esc(UI.briefQ)+'" placeholder="Type a name"></label>');
  h+=errBanner();
  if(S.archiveError&&!S.loading)h+='<div class="banner info"><span>'+esc(S.archiveError)+' Until then only the current deck from the Project Tracker shows.</span></div>';
  if(!all.length)return h+emptyClients()+footer();
  if(!list.length)return h+'<section class="panel"><div class="empty">No client matches that name.</div></section>'+footer();
  h+='<div class="bgrid">'+list.map(c=>{
    const arc=archiveFor(c.id),d=decksFor(c),ph=phaseLabel(phaseOf(c));const bg=boardFor(c).map(b=>b.goal).find(Boolean);const goal=goalText(arc[arc.length-1])||(bg?String(bg).slice(0,120):null);
    return '<section class="adcard bcard"><div class="card-h"><div><div class="blk-n">'+esc(c.name)+'</div><div class="note">'+esc([c.po&&("PO "+c.po),c.strat&&("Strat "+c.strat)].filter(Boolean).join(" · "))+'</div></div>'+(ph?'<span class="pill">'+ph+'</span>':'')+'</div>'+
      '<div class="goal-box"><span>90-day goal</span><b>'+esc(goal||"Not set yet")+'</b></div>'+
      (d.length?'<div class="deck-list">'+d.map(x=>'<a class="deck" href="'+esc(x.url)+'" target="_blank" rel="noopener"><span class="deck-t">'+esc(x.label)+'<small>'+esc(x.meta||"")+'</small></span><span class="deck-o">Open</span></a>').join("")+'</div>':'<div class="note">No strategy deck yet.</div>')+'</section>';
  }).join("")+'</div>';
  return h+footer();
}

/* ---------- motion, tab pill, theme ---------- */
function movePill(){const b=document.querySelector('#tabs button[aria-current="page"]'),p=$("#tab-pill");if(!b||!p)return;p.style.width=b.offsetWidth+"px";p.style.transform="translateX("+b.offsetLeft+"px)"}
function stagger(root){let n=0;root.querySelectorAll(".panel,.adcard,.frow,.ucard,.blk,.bpill").forEach(el=>{el.style.setProperty("--i",Math.min(n++,14))})}
const ICON_SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICON_MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function paintThemeBtn(){const light=document.documentElement.getAttribute("data-theme")==="light";const b=$("#theme-btn");if(b)b.innerHTML=(light?ICON_MOON+"Dark":ICON_SUN+"Light")}
function toggleTheme(){const r=document.documentElement;const light=r.getAttribute("data-theme")!=="light";if(light)r.setAttribute("data-theme","light");else r.removeAttribute("data-theme");try{localStorage.setItem("mo2-theme",light?"light":"dark")}catch(e){}paintThemeBtn()}

function viewLogin(){
  return '<section class="login"><div class="login-card">'+
    '<span class="mark big" aria-hidden="true"></span>'+
    '<div class="eyebrow">Editoz Club</div><h1>Marketing Ops</h1>'+
    '<p class="note">Sign in with your Editoz email and the team password.</p>'+
    '<form id="loginform" class="login-form" novalidate>'+
    '<label class="f" for="login-email">Work email<input id="login-email" name="email" type="email" autocomplete="username" placeholder="you@editozclub.com" required></label>'+
    '<label class="f" for="login-pass">Password<input id="login-pass" name="password" type="password" autocomplete="current-password" required></label>'+
    '<p class="login-err" id="login-err" role="alert"></p>'+
    '<button type="submit" class="primary">Sign in</button></form></div></section>';
}
function render(){
  document.body.classList.toggle("locked",!!S.locked);
  const who=$("#who");if(who){who.textContent=S.user||"";who.parentElement.hidden=!S.user}
  if(S.locked){const app=$("#app");if(!$("#loginform")){app.innerHTML='<div class="view enter">'+viewLogin()+'</div>';const em=$("#login-email");if(em)em.focus()}return}
  renderTabs();
  const app=$("#app");
  const views={today:viewToday,funnels:viewFunnels,upsell:viewUpsell,ads:viewAds,briefs:viewBriefs};
  const active=document.activeElement&&document.activeElement.id;
  // keep anything the user is typing across re-renders
  const kept={};if(!UI.resetLog)app.querySelectorAll(".logform input[id],.pitch-in").forEach(el=>{if(el===document.activeElement||el.dataset.dirty)kept[el.id]=el.value});UI.resetLog=false;
  ["off-panel","recent-panel"].forEach(id=>{const el=document.getElementById(id);if(el)UI[id==="off-panel"?"offOpen":"recentOpen"]=el.open});
  const laterOpen=$("details.later");if(laterOpen)UI.laterOpen=laterOpen.open;
  const anim=UI.anim;UI.anim=false;
  app.innerHTML='<div class="view'+(anim?' enter':'')+'">'+(views[UI.tab]||viewToday)()+'</div>';
  if(anim)stagger(app);
  const lo=$("details.later");if(lo&&UI.laterOpen)lo.open=true;
  requestAnimationFrame(movePill);
  Object.keys(kept).forEach(id=>{const el=document.getElementById(id);if(el){el.value=kept[id];el.dataset.dirty="1"}});
  if(active){const el=document.getElementById(active);if(el&&el.id==="brief-q"){el.focus();el.setSelectionRange(el.value.length,el.value.length)}}
  document.querySelectorAll(".pitch-in").forEach(autoGrow);
}
function autoGrow(t){t.style.height="auto";t.style.height=Math.max(38,t.scrollHeight+2)+"px"}

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const tb=e.target.closest("#tabs button");if(tb){setTab(tb.dataset.tab);return}
  const go=e.target.closest("[data-tab-go]");if(go){e.preventDefault();setTab(go.dataset.tabGo);return}
  if(e.target.closest('[data-act="reload"]')){UI.animOnLoad=true;loadAll(true);return}
  if(e.target.closest('[data-act="untagged"]')){UI.showUntagged=!UI.showUntagged;render();return}
  if(e.target.closest("#theme-btn")){toggleTheme();return}
  if(e.target.closest("#signout")){try{await api("/api/login",{method:"POST",body:{logout:true}})}catch(x){}S.locked=true;S.user=null;S.clients=[];S.projects=[];S.tasks=[];S.ads=[];S.upsell={};render();return}
  const blk=e.target.closest("[data-blk]");if(blk){UI.blkOpen[blk.dataset.blk]=!UI.blkOpen[blk.dataset.blk];render();return}
  const man=e.target.closest("[data-manage]");if(man){UI.manage[man.dataset.manage]=!UI.manage[man.dataset.manage];if(man.closest("#off-panel"))UI.offOpen=true;render();return}
  const eu=e.target.closest("[data-edit-up]");if(eu){UI.editUp[eu.dataset.editUp]=!UI.editUp[eu.dataset.editUp];render();return}
  const cell=e.target.closest("[data-cell]");if(cell){UI.selCell=UI.selCell===cell.dataset.cell?null:cell.dataset.cell;render();return}
  const clr=e.target.closest("[data-clear]");
  if(clr&&S.upsellOn){
    clr.disabled=true;clr.textContent="Removing…";
    try{await api("/api/upsell?clientId="+encodeURIComponent(clr.dataset.clear),{method:"DELETE"});toast("Checkpoint removed");UI.editUp[clr.dataset.clear]=false;loadAll(true)}catch(x){toast("Couldn't remove: "+x.message);clr.disabled=false}
    return;
  }
  const del=e.target.closest("[data-del]");
  if(del&&S.adsOn){
    del.disabled=true;del.textContent="Deleting…";UI.recentOpen=true;
    try{await api("/api/ads?id="+encodeURIComponent(del.dataset.del),{method:"DELETE"});toast("Entry deleted");loadAll(true)}catch(x){toast("Couldn't delete: "+x.message);del.disabled=false;del.textContent="Delete"}
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="brief-q"){UI.briefQ=t.value;render();return}
  if(t.classList.contains("pitch-in")){t.dataset.dirty="1";autoGrow(t);return}
  if(/^(sp|rs|nt)-[0-9a-f]{32}$/.test(t.id||""))t.dataset.dirty="1";
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="adlog-date"){UI.adDate=t.value||YESTERDAY;UI.resetLog=true;render();return}
  if(t.classList.contains("pitch-in")){
    const id=t.dataset.pitch,text=t.value.trim(),p=S.projects.find(x=>x.id===id);
    if(p&&(p.pitch||"")===text){delete t.dataset.dirty;return}
    t.classList.add("saving");
    try{await api("/api/pitch",{method:"POST",body:{projectId:id,text}});if(p)p.pitch=text;delete t.dataset.dirty;t.classList.remove("saving");t.classList.add("saved");setTimeout(()=>t.classList.remove("saved"),1200);toast("Pitch saved")}
    catch(x){t.classList.remove("saving");toast("Couldn't save pitch: "+x.message)}
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&e.target.classList&&e.target.classList.contains("pitch-in")){e.preventDefault();e.target.blur()}});
document.addEventListener("submit",async e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==="loginform"){
    const err=$("#login-err"),btn=f.querySelector("button");err.textContent="";
    const email=f.email.value.trim(),password=f.password.value;
    if(!/@editozclub\.com$/i.test(email)){err.textContent="Use your @editozclub.com email.";return}
    if(!password){err.textContent="Enter the team password.";return}
    btn.disabled=true;btn.textContent="Signing in…";
    try{await api("/api/login",{method:"POST",body:{email,password}});UI.animOnLoad=true;S.locked=false;await loadAll(true)}
    catch(x){err.textContent=x.message||"Couldn't sign in.";btn.disabled=false;btn.textContent="Sign in";f.password.value="";f.password.focus()}
    return;
  }
  const btn=f.querySelector('button[type="submit"]');
  const label=btn?btn.textContent:"";
  if(f.dataset.log){
    if(!S.adsOn){toast("Ad logging is switched off");return}
    const id=f.dataset.log,c=clientById(id),a=adInfo(id);
    const sp=$("#sp-"+id).value,rs=$("#rs-"+id).value,nt=$("#nt-"+id).value.trim();
    if(sp===""&&rs===""){toast("Add spend or "+a.label.toLowerCase()+" first");return}
    btn.disabled=true;btn.textContent="Saving…";
    try{
      await api("/api/ads",{method:"POST",body:{entries:[{clientId:id,clientName:c?c.name:"",date:UI.adDate||YESTERDAY,spend:+sp||0,results:+rs||0,resultLabel:a.label,currency:a.cur,note:nt}]}});
      toast((c?c.name:"Client")+" logged");["sp-","rs-","nt-"].forEach(p=>{const el=$("#"+p+id);if(el)delete el.dataset.dirty});UI.resetLog=true;await loadAll(true);
    }catch(x){toast("Couldn't save: "+x.message);btn.disabled=false;btn.textContent=label}
    return;
  }
  if(f.dataset.adset){
    if(!S.adClientsOn){toast("Ad settings are switched off");return}
    const id=f.dataset.adset,c=clientById(id);
    const body={clientId:id,clientName:c?c.name:"",running:f.running.checked,resultLabel:f.resultLabel.value,currency:f.currency.value,target:f.target.value};
    btn.disabled=true;btn.textContent="Saving…";
    try{await api("/api/adclients",{method:"POST",body});toast((c?c.name:"Client")+(body.running?" is running ads":" saved"));UI.manage[id]=false;await loadAll(true)}
    catch(x){toast("Couldn't save: "+x.message);btn.disabled=false;btn.textContent=label}
    return;
  }
  if(f.dataset.upsell){
    if(!S.upsellOn){toast("Checkpoints are switched off");return}
    const d=Object.fromEntries(new FormData(f));const id=f.dataset.upsell,c=clientById(id);
    btn.disabled=true;btn.textContent="Saving…";
    try{
      await api("/api/upsell",{method:"POST",body:{clientId:id,clientName:c?c.name:"",route:d.route||"",offer:String(d.offer||"").trim(),nextDate:d.nextDate||"",status:d.status||"planned",proposal:String(d.proposal||"").trim(),note:String(d.note||"").slice(0,400)}});
      toast("Saved");UI.editUp[id]=false;loadAll(true);
    }catch(x){toast("Couldn't save: "+x.message);btn.disabled=false;btn.textContent=label}
  }
});

/* ---------- boot ---------- */
UI.animOnLoad=true;
paintThemeBtn();
render();
loadAll(false);
window.addEventListener("resize",movePill);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(movePill);
})();
</script>
